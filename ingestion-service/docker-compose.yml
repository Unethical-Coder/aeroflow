services:
  # 1. Primary Database: For storing persistent workload data
  postgres:
    image: postgres:16-alpine
    container_name: aeroflow-postgres
    environment:
      POSTGRES_USER: aeroflow_user
      POSTGRES_PASSWORD: aeroflow_password
      POSTGRES_DB: aeroflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Caching & Rate Limiting: For lightning-fast data access
  redis:
    image: redis:7-alpine
    container_name: aeroflow-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 3. Message Broker: Confluent's Enterprise-Standard Local Image
  kafka:
    image: confluentinc/confluent-local:7.5.0
    container_name: aeroflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data: